name: Publish using .NET Core
on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

permissions:
  contents: read

jobs:
  build:

    runs-on: windows-latest
    environment: nuget
    permissions:
      contents: read # checkout
      id-token: write # NuGet trusted publishing (OIDC)

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Setup .NET Core
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
      with:
        dotnet-version: 8.0.x
    - name: Pack with dotnet
      run: dotnet pack --include-symbols --configuration Release
    - name: Upload artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: release
        path: SlimLib.Auth.Azure/bin/Release
    - name: NuGet login (OIDC)
      id: login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      with:
        user: ${{ vars.NUGET_USER }}
    - name: Push with dotnet nuget
      env:
        NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
      run: |
        $file = Get-ChildItem -File SlimLib.Auth.Azure/bin/Release/SlimLib.Auth.Azure.*.symbols.nupkg
        dotnet nuget push "$file" -s "https://api.nuget.org/v3/index.json" -k "$env:NUGET_API_KEY"
